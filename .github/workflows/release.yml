name: Release

# Dispara quando uma tag v*.*.* é pushed.
# Exemplo: git tag v1.0.43 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # permite disparo manual pela aba Actions do GitHub

# Necessário pro electron-updater conseguir criar/editar releases via GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # SÓ Windows: toda a equipe usa Windows (notebooks Positivo). O build de
      # macOS foi removido do release por ser desperdício de CI (ninguém usa o
      # .dmg). Se um dia precisar de Mac, re-adicione um item `os: macos-latest`
      # / `label: macos` no matrix + os passos "Empacotar (macOS)" / "Anexar
      # assets do macOS" (ver histórico do git).
      matrix:
        include:
          # Windows: NSIS .exe + latest.yml
          - os: windows-latest
            label: windows

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          # Node 22: os scripts de teste (scripts/test-*.mjs) importam .ts
          # direto, o que exige strip de tipos nativo (Node >= 22). Em Node 20
          # o `npm test` quebra com erro de extensão desconhecida.
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          npm_config_optional: "true"

      # ── Portão de qualidade: roda ANTES do build/publish ──────────────────
      # Um erro de tipo ou parser quebrado nunca mais vai pro release sem aviso.
      # Os dois scripts já existem no package.json e são baratos (segundos).
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Testes (scripts/test-*.mjs)
        run: npm test

      # Cache dos downloads do electron-builder (binario electron arm64+x64,
      # winCodeSign, nsis, nsis-resources). Sem cache, cada job rebaixa
      # ~150-200MB toda vez. Key inclui SO + lockfile (lockfile muda quando
      # versao do electron-builder/electron muda no package.json).
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Gerar ícones (todos os formatos)
        # build-icon.js gera .ico, .icns e .png numa só chamada — funciona
        # em qualquer plataforma porque png2icons e sharp são puros JS.
        run: npm run icon:build

      - name: Build Next.js standalone
        run: npm run build

      # Garante que a release existe antes de qualquer upload manual.
      # Idempotente e tolerante a corrida: se `view` nao acha, tenta `create`;
      # se `create` falhar (release ja existe -> 422), re-checa `view` -- se
      # passar, esta tudo OK; se nao, ai sim falha de verdade. (Mantido idempotente
      # de proposito, caso um dia volte a haver mais de um job no matrix.)
      - name: Garantir release no GitHub
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}" \
              || gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────────
      # Windows
      # ────────────────────────────────────────────────────────────────────
      - name: Empacotar (Windows)
        if: matrix.label == 'windows'
        run: npx electron-builder --win nsis --publish never

      - name: Anexar assets do Windows na release
        if: matrix.label == 'windows'
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist-electron/MyStoriesLena-Setup-*.exe \
            dist-electron/MyStoriesLena-Setup-*.exe.blockmap \
            dist-electron/latest.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload do artefato (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-build
          path: dist-electron/
          if-no-files-found: warn
          retention-days: 7
